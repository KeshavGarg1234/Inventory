# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# The command that starts the app. For Next.js, this is typically 'npm run start'
runCommand: 'npm run start'

# Specifies the location of the static assets after a build.
staticDirectory: '.next/static'

# Required for Next.js with Server Actions
# https://firebase.google.com/docs/app-hosting/configure#server-actions
headers:
  - headers:
      - key: 'x-forwarded-host'
        value: '{{request.host}}'
    source: '**'
